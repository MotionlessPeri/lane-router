<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lane Router 看板</title>
<style>
  :root { color-scheme: light dark; --line: #8883; --dim: #8886; --warn: #b45309; }
  body { margin: 0; padding: 1rem 1.25rem 3rem; font: 13px/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace; }
  h1 { font-size: 15px; margin: 0; }
  h2 { font-size: 13px; margin: 1.75rem 0 .5rem; padding-bottom: .25rem; border-bottom: 1px solid var(--line); }
  header { display: flex; gap: 1rem; align-items: baseline; flex-wrap: wrap; }
  .dim { color: var(--dim); }
  .warn { color: var(--warn); }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; vertical-align: top; padding: .25rem .6rem .25rem 0; border-bottom: 1px solid var(--line); }
  th { font-weight: 600; color: var(--dim); white-space: nowrap; }
  td.nowrap, th.nowrap { white-space: nowrap; }
  .body { white-space: pre-wrap; word-break: break-word; max-width: 60ch; }
  .role { white-space: pre-wrap; word-break: break-word; max-width: 40ch; color: var(--dim); }
  details { margin-top: .75rem; }
  summary { cursor: pointer; color: var(--dim); }
  /* A folded section header has to read as a section header, not as a link inside one: same size,
     weight and rule as the h2 it stands in for, with the disclosure marker as the only difference. */
  summary.section {
    font-size: 13px; font-weight: 600; color: inherit;
    margin: 1.75rem 0 .5rem; padding-bottom: .25rem; border-bottom: 1px solid var(--line);
  }
  .empty { color: var(--dim); padding: .4rem 0; }
  .lane-group { margin: .65rem 0; }
  .lane-group h3 { font-size: 13px; margin: 0 0 .25rem; font-weight: 600; }
  .lane-group h3 .dim { font-weight: normal; }
  .lane-choice, .override-grid { display: block; margin: .2rem 0; }
  .override-grid { display: grid; grid-template-columns: 9rem minmax(12rem, 24rem); gap: .35rem .6rem; align-items: center; }
  .override-grid label, .set-controls label { color: var(--dim); }
  .override-grid input, .override-grid select, .set-controls input, .set-controls select { font: inherit; padding: .15rem .3rem; }
  .set-controls { display: grid; grid-template-columns: 9rem minmax(12rem, 24rem) auto; gap: .35rem .6rem; align-items: center; justify-content: start; margin-top: 1rem; }
  #launcher-status { margin-top: .5rem; white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>Lane Router 看板</h1>
  <span id="router" class="dim"></span>
  <span id="status" class="dim"></span>
</header>

<!--
  Ordered by what the reader does, not by what the snapshot contains. The launcher is the one
  section people operate; the two long ones (29 lanes with their role descriptions, 200 message
  bodies) used to push it below the fold. Those two fold instead, and the fold state survives the
  poll because only the inner div is replaced - the details element itself is never re-rendered.
  The backlog stays open: it is short, and it is the panel that surfaces a lane nobody is answering.
-->
<h2>恢复 lane</h2>
<div id="launcher"></div>

<h2>积压队列</h2>
<div id="backlog"></div>

<details>
  <summary class="section">lane 拓扑</summary>
  <div id="lanes"></div>
</details>

<details>
  <summary class="section">消息流</summary>
  <div id="messages"></div>
</details>

<script>
(function () {
  "use strict";
  var POLL_MS = 5000;
  var currentSnapshot = null;

  /**
   * Everything this page displays was written by another lane or by a person: role descriptions,
   * message bodies, working directories, lane addresses. It is data, and this is the one place
   * where it could stop being data — so nodes are built and filled here, and `innerHTML` and its
   * relatives appear nowhere in this file.
   */
  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) { node.className = className; }
    if (text !== undefined && text !== null) { node.textContent = String(text); }
    return node;
  }

  function replace(host, node) {
    while (host.firstChild) { host.removeChild(host.firstChild); }
    host.appendChild(node);
  }

  function table(headings, rows) {
    if (rows.length === 0) { return el("div", "empty", "（空）"); }
    var element = document.createElement("table");
    var head = document.createElement("tr");
    headings.forEach(function (heading) { head.appendChild(el("th", "nowrap", heading)); });
    element.appendChild(head);
    rows.forEach(function (cells) {
      var row = document.createElement("tr");
      cells.forEach(function (cell) { row.appendChild(cell); });
      element.appendChild(row);
    });
    return element;
  }

  /** The owed-ack duration is computed here, from capturedAt and createdAt, so the snapshot need
   *  not carry a third number that could disagree with the two it came from. */
  function age(capturedAt, since) {
    if (since === null || since === undefined) { return "—"; }
    var seconds = Math.max(0, Math.round((capturedAt - since) / 1000));
    if (seconds < 60) { return seconds + " 秒"; }
    var minutes = Math.floor(seconds / 60);
    if (minutes < 60) { return minutes + " 分"; }
    var hours = Math.floor(minutes / 60);
    if (hours < 24) { return hours + " 小时 " + (minutes % 60) + " 分"; }
    return Math.floor(hours / 24) + " 天 " + (hours % 24) + " 小时";
  }

  function clock(value) {
    if (value === null || value === undefined) { return "—"; }
    var date = new Date(value);
    function pad(n) { return (n < 10 ? "0" : "") + n; }
    return pad(date.getHours()) + ":" + pad(date.getMinutes()) + ":" + pad(date.getSeconds());
  }

  function reachText(lane) {
    if (!lane.binding) { return "未绑定"; }
    if (!lane.reach) { return "无 backend"; }
    return lane.reach.state + (lane.reach.believedBusy ? "（忙）" : "");
  }

  function laneRow(snapshot, lane) {
    return [
      el("td", "nowrap", lane.address),
      el("td", "role", lane.roleDescription),
      el("td", "nowrap", lane.binding ? lane.binding.backend : "—"),
      el("td", "nowrap", lane.binding ? "gen" + lane.binding.generation : "—"),
      el("td", "nowrap", lane.model || "—"),
      el("td", "nowrap", reachText(lane)),
      el("td", "nowrap", lane.reach ? age(snapshot.capturedAt, lane.reach.lastLifecycleAt) : "—"),
      el("td", null, (lane.binding && lane.binding.cwd) || "—")
    ];
  }

  var LANE_HEADINGS = ["lane", "角色", "backend", "generation", "model", "可达", "上次活动", "cwd"];

  function renderLanes(snapshot) {
    var live = snapshot.lanes.filter(function (lane) { return !lane.archived; });
    var archived = snapshot.lanes.filter(function (lane) { return lane.archived; });
    var host = document.createElement("div");
    host.appendChild(table(LANE_HEADINGS, live.map(function (lane) { return laneRow(snapshot, lane); })));
    if (archived.length > 0) {
      // Folded, not dropped: archived lanes should not take up the view, but "where did that lane
      // go" is a question people actually ask, and it has no other answer here.
      var details = document.createElement("details");
      details.appendChild(el("summary", null, "已归档 " + archived.length + " 条"));
      details.appendChild(table(LANE_HEADINGS, archived.map(function (lane) { return laneRow(snapshot, lane); })));
      host.appendChild(details);
    }
    replace(document.getElementById("lanes"), host);
  }

  function launcherState() {
    const choices = new Map();
    document.querySelectorAll("input[data-lane-checkbox]").forEach((checkbox) => {
      choices.set((checkbox).value, (checkbox).checked);
    });
    const overrides = new Map();
    document.querySelectorAll("[data-override]").forEach((control) => {
      overrides.set(control.getAttribute("data-override"), control.value);
    });
    const setControls = new Map();
    document.querySelectorAll("[data-set-control]").forEach((control) => {
      setControls.set(control.getAttribute("data-set-control"), control.value);
    });
    const status = document.getElementById("launcher-status");
    const active = document.activeElement;
    return {
      choices,
      overrides,
      setControls,
      statusText: status ? status.textContent : "",
      statusClassName: status ? status.className : "",
      activeOverride: active && active.matches("[data-override]")
        ? active.getAttribute("data-override")
        : null,
      activeSetControl: active && active.matches("[data-set-control]")
        ? active.getAttribute("data-set-control")
        : null,
    };
  }

  function launcherLane(lane, previous) {
    const choice = el("label", "lane-choice");
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.setAttribute("data-lane-checkbox", lane.address);
    checkbox.value = lane.address;
    // Nothing is selected until somebody selects it. Opening a lane is a visible act — a window
    // appears and a conversation resumes — so the page must not arrive with a set already ticked
    // and one click away from launching it. A poll refresh keeps whatever the reader chose;
    // it never re-ticks a box on their behalf.
    checkbox.checked = previous.choices.get(lane.address) === true && lane.binding !== null;
    checkbox.disabled = lane.binding === null;
    choice.appendChild(checkbox);
    // Backend, presence and model stay on the row: presence is how the reader tells an already
    // open lane from one worth ticking, without unfolding the topology section to look it up.
    const startup = lane.binding && lane.binding.backend === "codex"
      ? " · " + (lane.binding.profile || "—") + " / " + (lane.binding.modelProvider || "—")
      : "";
    choice.appendChild(document.createTextNode(
      " " + lane.address + " · " + (lane.binding ? lane.binding.backend : "未绑定")
      + startup + " · " + (lane.restorePresence || "无 backend") + " · " + (lane.model || "未声明模型")
    ));
    return choice;
  }

  function syncGroupCheckbox(group, groupCheckbox) {
    const checkboxes = [...group.querySelectorAll("input[data-lane-checkbox]")];
    const selectable = checkboxes.filter((checkbox) => !checkbox.disabled);
    groupCheckbox.checked = selectable.length > 0 && selectable.every((checkbox) => checkbox.checked);
    groupCheckbox.indeterminate = !groupCheckbox.checked && selectable.some((checkbox) => checkbox.checked);
  }

  // By name, not in snapshot order: the snapshot lists lanes as they were created, and nobody
  // looks a group up by when it was created. Case-insensitive so "MobuLiveLink" sits among the
  // m's rather than ahead of every lower-case name.
  const byName = (a, b) => a.localeCompare(b, undefined, { sensitivity: "base" });

  /**
   * The launcher's groups. A lane in a set is listed under the set, any other lane under its
   * project, and a set with no lanes is still a group: it was made on purpose and is waiting to be
   * filled. A Router older than sets publishes no `laneSets`, and then every lane is under its
   * project exactly as before.
   */
  function launcherGroups(snapshot) {
    const live = snapshot.lanes.filter((lane) => !lane.archived);
    const byAddress = new Map(live.map((lane) => [lane.address, lane]));
    const placed = new Set();
    const groups = [];
    (Array.isArray(snapshot.laneSets) ? snapshot.laneSets : []).forEach((set) => {
      const lanes = set.members.map((address) => byAddress.get(address)).filter((lane) => lane !== undefined);
      lanes.forEach((lane) => placed.add(lane.address));
      groups.push({ name: set.name, set, lanes });
    });
    const projects = new Map();
    live.filter((lane) => !placed.has(lane.address)).forEach((lane) => {
      if (!projects.has(lane.project)) projects.set(lane.project, []);
      projects.get(lane.project).push(lane);
    });
    projects.forEach((lanes, project) => groups.push({ name: project, set: null, lanes }));
    groups.sort((a, b) => byName(a.name, b.name));
    groups.forEach((group) => group.lanes.sort((a, b) => byName(a.address, b.address)));
    return groups;
  }

  function checkedAddresses() {
    return [...document.querySelectorAll("input[data-lane-checkbox]")].
      filter((checkbox) => checkbox.checked).
      map((checkbox) => checkbox.value);
  }

  function actionButton(id, text) {
    const button = document.createElement("button");
    if (id) button.id = id;
    button.type = "button";
    button.textContent = text;
    return button;
  }

  /**
   * Making a set and filling it, acting on the same ticked lanes the open button does. Marked
   * `data-set-control` and never `data-override`: every `data-override` value goes out as a launch
   * option when lanes are opened, so a set control marked that way would reach the CLI.
   */
  function setControls(snapshot, previous) {
    const block = el("div", "set-controls");

    const nameField = el("label", null, "新建 set");
    nameField.setAttribute("for", "new-set-name");
    const name = document.createElement("input");
    name.id = "new-set-name";
    name.type = "text";
    name.setAttribute("data-set-control", "new-set-name");
    name.value = previous.setControls.get("new-set-name") || "";
    const create = actionButton("create-set", "新建");
    create.addEventListener("click", () => {
      const value = name.value.trim();
      if (value === "") return setLauncherStatus("先填 set 名。", true);
      // Emptied before the reload, which would otherwise carry the name over as unfinished input.
      sendSetAction({ action: "create", name: value }, "已新建 set " + value + "。", () => { name.value = ""; });
    });
    block.appendChild(nameField);
    block.appendChild(name);
    block.appendChild(create);

    const moveField = el("label", null, "把选中 lane 移入");
    moveField.setAttribute("for", "move-to-set");
    const move = document.createElement("select");
    move.id = "move-to-set";
    move.setAttribute("data-set-control", "move-to-set");
    selectOption(move, "", "项目默认");
    snapshot.laneSets.slice().sort((a, b) => byName(a.name, b.name)).forEach((set) => selectOption(move, set.id, set.name));
    const preserved = previous.setControls.get("move-to-set") || "";
    if ([...move.options].some((option) => option.value === preserved)) move.value = preserved;
    const moveButton = actionButton("move-selected", "移入");
    moveButton.addEventListener("click", () => {
      const addresses = checkedAddresses();
      if (addresses.length === 0) return setLauncherStatus("先勾选要移动的 lane。", true);
      const target = snapshot.laneSets.find((set) => set.id === move.value);
      // "项目默认" is the empty value and means back to each lane's project, which the Router
      // reads from null rather than from an empty id.
      sendSetAction(
        { action: "assign", addresses, setId: target ? target.id : null },
        "已把 " + addresses.length + " 条 lane " + (target ? "移入 " + target.name : "移回各自的项目") + "。",
      );
    });
    block.appendChild(moveField);
    block.appendChild(move);
    block.appendChild(moveButton);
    return block;
  }

  /** One set request; on success the board is reloaded, on refusal the Router's sentence is shown. */
  function sendSetAction(body, doneText, beforeReload) {
    if (!currentSnapshot || currentSnapshot.actionToken === undefined) return;
    fetch("/dashboard/lane-sets", {
      method: "POST",
      headers: { "content-type": "application/json", "x-lane-router-action": "lane-sets" },
      body: JSON.stringify(Object.assign({}, body, { actionToken: currentSnapshot.actionToken })),
    }).then((response) => response.json().catch(() => ({})).then((result) => {
      if (!response.ok) throw new Error(result && result.error ? result.error : "set 接口返回 " + response.status);
    })).then(() => {
      if (beforeReload) beforeReload();
      setLauncherStatus(doneText);
      return load();
    }).catch((error) => {
      setLauncherStatus("set 操作失败：" + (error && error.message ? error.message : "未知错误"), true);
    });
  }

  function selectOption(select, value, text) {
    const option = el("option", null, text);
    option.value = value;
    select.appendChild(option);
  }

  function launcherSelect(id, label, overrideName, options, previous) {
    const field = el("label", null, label);
    field.setAttribute("for", id);
    const select = document.createElement("select");
    select.id = id;
    select.name = id;
    select.setAttribute("data-override", overrideName);
    selectOption(select, "", "默认（不覆盖）");
    options.forEach((option) => selectOption(select, option.value, option.label));
    const preserved = previous.overrides.get(overrideName) || "";
    if ([...select.options].some((option) => option.value === preserved)) select.value = preserved;
    return { field, select };
  }

  function startupForModel(profiles, model, defaultModelProvider) {
    const exact = profiles.filter((entry) => entry.model === model);
    if (exact.length === 1) {
      return { profile: exact[0].name, modelProvider: exact[0].modelProvider ?? defaultModelProvider };
    }
    // model/list has no provider field, so a unique configured profile family is
    // the strongest available signal before falling back to the base provider.
    const family = model.split("-", 1)[0].toLowerCase();
    const familyProviders = [...new Set(profiles
      .filter((entry) => entry.model && entry.model.split("-", 1)[0].toLowerCase() === family)
      .map((entry) => entry.modelProvider)
      .filter((value) => value !== undefined))];
    return {
      profile: "",
      modelProvider: familyProviders.length === 1 ? familyProviders[0] : defaultModelProvider,
    };
  }

  function renderLauncher(snapshot) {
    const previous = launcherState();
    const host = document.createElement("div");
    if (snapshot.actionToken === undefined) {
      host.appendChild(el("div", "empty", "当前 Router 未启用网页恢复。"));
      const disabledButton = document.createElement("button");
      disabledButton.id = "open-selected";
      disabledButton.type = "button";
      disabledButton.disabled = true;
      disabledButton.textContent = "打开选中 lane";
      host.appendChild(disabledButton);
      return replace(document.getElementById("launcher"), host);
    }

    // Above the groups rather than inside one, because it acts on all of them. Disabled lanes
    // (no binding, nothing to resume) are never ticked by it: they are not choices, and a control
    // that appears to select them would report a selection the launcher cannot act on.
    const selectAllChoice = el("label", "lane-choice");
    const selectAll = document.createElement("input");
    selectAll.type = "checkbox";
    selectAll.setAttribute("data-select-all", "");
    selectAllChoice.appendChild(selectAll);
    selectAllChoice.appendChild(document.createTextNode(" 全选 / 取消全选"));
    host.appendChild(selectAllChoice);

    const selectableLanes = () =>
      [...host.querySelectorAll("input[data-lane-checkbox]")].filter((checkbox) => !checkbox.disabled);

    // Assigned once the model menu exists, further down; the selection handlers are wired before
    // that and would otherwise have nothing to call.
    let applyModelFilter = () => {};

    function syncSelectAll() {
      const selectable = selectableLanes();
      selectAll.disabled = selectable.length === 0;
      selectAll.checked = selectable.length > 0 && selectable.every((checkbox) => checkbox.checked);
      // Neither all nor none: the box shows a third state rather than guessing at one of the two,
      // so ticking it from here is always "select everything" and never a silent deselect.
      selectAll.indeterminate = !selectAll.checked && selectable.some((checkbox) => checkbox.checked);
    }

    selectAll.addEventListener("change", () => {
      selectableLanes().forEach((checkbox) => { checkbox.checked = selectAll.checked; });
      host.querySelectorAll("section.lane-group").forEach((group) => {
        syncGroupCheckbox(group, group.querySelector("input[data-group-checkbox]"));
      });
      syncSelectAll();
      applyModelFilter();
    });

    launcherGroups(snapshot).forEach((entry) => {
      const group = el("section", "lane-group");
      group.setAttribute("data-group", entry.name);
      const groupChoice = el("label", null);
      const groupCheckbox = document.createElement("input");
      groupCheckbox.type = "checkbox";
      groupCheckbox.setAttribute("data-group-checkbox", entry.name);
      groupCheckbox.addEventListener("change", () => {
        group.querySelectorAll("input[data-lane-checkbox]").forEach((checkbox) => {
          (checkbox).checked = groupCheckbox.checked && !checkbox.disabled;
        });
        syncGroupCheckbox(group, groupCheckbox);
        syncSelectAll();
        applyModelFilter();
      });
      groupChoice.appendChild(groupCheckbox);
      groupChoice.appendChild(document.createTextNode(" " + entry.name));
      const heading = el("h3", null);
      heading.appendChild(groupChoice);
      if (entry.set !== null) {
        heading.appendChild(el("span", "dim", " · set"));
        // Only an empty set can be deleted. The Router refuses the others, so a button on them
        // could only ever fail.
        if (entry.lanes.length === 0) {
          const remove = actionButton(null, "删除");
          remove.setAttribute("data-delete-set", entry.set.id);
          remove.addEventListener("click", () => {
            sendSetAction({ action: "delete", setId: entry.set.id }, "已删除 set " + entry.set.name + "。");
          });
          heading.appendChild(document.createTextNode(" "));
          heading.appendChild(remove);
        }
      }
      group.appendChild(heading);
      if (entry.lanes.length === 0) group.appendChild(el("div", "empty", "（空）"));
      entry.lanes.forEach((lane) => group.appendChild(launcherLane(lane, previous)));
      group.querySelectorAll("input[data-lane-checkbox]").forEach((checkbox) => {
        checkbox.addEventListener("change", () => {
          syncGroupCheckbox(group, groupCheckbox);
          syncSelectAll();
          applyModelFilter();
        });
      });
      syncGroupCheckbox(group, groupCheckbox);
      host.appendChild(group);
    });
    syncSelectAll();

    const overrides = el("div", "override-grid");
    // The backend is part of the label because the list holds both, and picking a Codex model for
    // a Claude lane fails at the CLI rather than in this page — late, and away from the choice.
    const model = launcherSelect("override-model", "model", "model", (snapshot.launcher?.models ?? []).map((entry) => ({
      value: entry.id,
      label: entry.displayName + (entry.hidden ? "（hidden）" : "") + (entry.backend ? " · " + entry.backend : ""),
    })), previous);
    /**
     * One override goes to every selected lane, so a model has to suit all of them. With lanes
     * from both CLIs picked at once no model does, and the menu says so by leaving only "default"
     * enabled rather than offering a name that would fail at whichever CLI it does not belong to.
     */
    const modelBackends = new Map((snapshot.launcher?.models ?? []).map((entry) => [entry.id, entry.backend]));
    applyModelFilter = () => {
      const picked = new Set([...host.querySelectorAll("input[data-lane-checkbox]")]
        .filter((checkbox) => checkbox.checked).map((checkbox) => checkbox.value));
      const backends = new Set(snapshot.lanes
        .filter((lane) => picked.has(lane.address) && lane.binding)
        .map((lane) => lane.binding.backend));
      [...model.select.options].forEach((option) => {
        const backend = modelBackends.get(option.value);
        const suitsAll = backends.size === 0 || backend === undefined || (backends.size === 1 && backends.has(backend));
        option.disabled = option.value !== "" && !suitsAll;
      });
      // A model picked before the selection changed can stop suiting it. Clearing it is the point
      // of the filter: leaving it would submit an override the lane cannot use, and the menu would
      // be showing a greyed-out option as the current choice.
      const current = [...model.select.options].find((option) => option.value === model.select.value);
      if (current && current.disabled) model.select.value = "";
    };

    const profiles = snapshot.launcher?.profiles ?? [];
    const profile = launcherSelect("override-profile", "Codex profile", "profile", profiles.map((entry) => ({
      value: entry.name,
      label: entry.name + (entry.modelProvider === undefined ? "" : ` · ${entry.modelProvider}`),
    })), previous);
    const provider = launcherSelect("override-provider", "modelProvider", "modelProvider", (snapshot.launcher?.modelProviders ?? []).map((value) => ({
      value,
      label: value,
    })), previous);
    profile.select.addEventListener("change", () => {
      const selected = profiles.find((entry) => entry.name === profile.select.value);
      model.select.value = selected?.model ?? "";
      provider.select.value = selected?.modelProvider ?? "";
    });
    model.select.addEventListener("change", () => {
      if (model.select.value === "") {
        profile.select.value = "";
        provider.select.value = "";
        return;
      }
      const startup = startupForModel(profiles, model.select.value, snapshot.launcher.defaultModelProvider);
      profile.select.value = startup.profile;
      provider.select.value = startup.modelProvider;
    });
    overrides.appendChild(model.field);
    overrides.appendChild(model.select);
    overrides.appendChild(profile.field);
    overrides.appendChild(profile.select);
    overrides.appendChild(provider.field);
    overrides.appendChild(provider.select);
    host.appendChild(overrides);

    const button = actionButton("open-selected", "打开选中 lane");
    button.addEventListener("click", openSelected);
    host.appendChild(button);
    // Only for a Router that publishes sets. An older one serves this same page as soon as it is
    // built, and has no endpoint behind these controls.
    if (Array.isArray(snapshot.laneSets)) host.appendChild(setControls(snapshot, previous));
    const status = el("div", null, null);
    status.id = "launcher-status";
    status.textContent = previous.statusText;
    status.className = previous.statusClassName;
    host.appendChild(status);
    // Once on render too, not only on change: a poll rebuilds this section with the selection the
    // reader already had, and the menu has to arrive matching it rather than a click behind.
    applyModelFilter();
    replace(document.getElementById("launcher"), host);
    if (previous.activeOverride !== null) {
      document.querySelectorAll("[data-override]").forEach((control) => {
        if (control.getAttribute("data-override") === previous.activeOverride) control.focus();
      });
    }
    if (previous.activeSetControl !== null) {
      document.querySelectorAll("[data-set-control]").forEach((control) => {
        if (control.getAttribute("data-set-control") === previous.activeSetControl) control.focus();
      });
    }
  }

  function renderBacklog(snapshot) {
    // Sorted by the oldest waiting message, not by count: ten fresh messages are not the problem
    // that one message nobody has touched for two days is.
    var waiting = snapshot.lanes.filter(function (lane) { return lane.pending.count > 0; })
      .sort(function (a, b) { return a.pending.oldestCreatedAt - b.pending.oldestCreatedAt; });
    replace(document.getElementById("backlog"), table(
      ["lane", "未处理", "最老一封已等", "可达"],
      waiting.map(function (lane) {
        var oldest = el("td", "nowrap", age(snapshot.capturedAt, lane.pending.oldestCreatedAt));
        if (snapshot.capturedAt - lane.pending.oldestCreatedAt > 3600000) { oldest.className = "nowrap warn"; }
        return [
          el("td", "nowrap", lane.address),
          el("td", "nowrap", lane.pending.count),
          oldest,
          el("td", "nowrap", reachText(lane))
        ];
      })
    ));
  }

  function renderMessages(snapshot) {
    var host = document.createElement("div");
    host.appendChild(table(
      ["时间", "发件方 → 收件方", "kind", "投递", "欠 ack", "正文"],
      snapshot.messages.map(function (message) {
        var owed = message.state === "pending"
          ? el("td", "nowrap", age(snapshot.capturedAt, message.createdAt))
          : el("td", "nowrap dim", "已 ack " + clock(message.resolvedAt));
        if (message.state === "pending" && snapshot.capturedAt - message.createdAt > 3600000) {
          owed.className = "nowrap warn";
        }
        return [
          el("td", "nowrap", clock(message.createdAt)),
          el("td", "nowrap", message.sender + " → " + message.target),
          el("td", "nowrap", message.kind),
          el("td", "nowrap", message.notificationState),
          owed,
          el("td", "body", message.body === null ? "（正文读不到）" : message.body)
        ];
      })
    ));
    if (snapshot.truncated && snapshot.truncated.messages) {
      host.appendChild(el("div", "empty", "只显示最近 " + snapshot.truncated.limit + " 封，更早的不在这里。"));
    }
    replace(document.getElementById("messages"), host);
  }

  function render(snapshot) {
    currentSnapshot = snapshot;
    document.getElementById("router").textContent =
      "pid " + snapshot.router.pid + " · 端口 " + snapshot.router.port + " · schema v" + snapshot.router.schemaVersion;
    document.getElementById("status").textContent = "快照 " + clock(snapshot.capturedAt);
    document.getElementById("status").className = "dim";
    renderLanes(snapshot);
    renderLauncher(snapshot);
    renderBacklog(snapshot);
    renderMessages(snapshot);
  }

  function load() {
    return fetch("/dashboard/state", { cache: "no-store" }).then(function (response) {
      if (!response.ok) { throw new Error("状态接口返回 " + response.status); }
      return response.json();
    }).then(render).catch(function (error) {
      // Said out loud: a board that quietly keeps showing its last snapshot is a board that lies
      // about how current it is, and staleness is the one thing it exists to rule out.
      var status = document.getElementById("status");
      status.textContent = "取不到快照：" + (error && error.message ? error.message : "未知错误");
      status.className = "warn";
    });
  }

  function openSelected() {
    if (!currentSnapshot || currentSnapshot.actionToken === undefined) return;
    const addresses = checkedAddresses();
    // Answered here rather than by the Router, which rejects an empty list with a 400 the reader
    // would see as "打开接口返回 400" — a transport code standing in for "you have not picked
    // anything yet". Nothing is selected by default, so this is the first click, not a rare one.
    if (addresses.length === 0) return setLauncherStatus("先勾选要打开的 lane。", true);
    const override = {};
    document.querySelectorAll("[data-override]").forEach((control) => {
      if (control.value.trim() !== "") override[control.getAttribute("data-override")] = control.value.trim();
    });
    const selected = new Set(addresses);
    const includesClaude = currentSnapshot.lanes.some((lane) =>
      selected.has(lane.address) && lane.binding && lane.binding.backend === "claude"
    );
    if (includesClaude && (override.profile !== undefined || override.modelProvider !== undefined)) {
      setLauncherStatus("Claude lane 不支持 Codex profile 或 modelProvider 覆盖。", true);
      return;
    }
    setLauncherStatus("正在请求打开 " + addresses.length + " 条 lane ...");
    fetch("/dashboard/lanes/open", {
      method: "POST",
      headers: { "content-type": "application/json", "x-lane-router-action": "open" },
      body: JSON.stringify({ addresses, override, actionToken: currentSnapshot.actionToken }),
    }).then((response) => {
      if (!response.ok) throw new Error("打开接口返回 " + response.status);
      return response.json();
    }).then((result) => {
      setLauncherStatus(formatOpenResults(result.results));
    }).catch((error) => {
      setLauncherStatus("打开失败：" + (error && error.message ? error.message : "未知错误"), true);
    });
  }

  function setLauncherStatus(text, warn) {
    const status = document.getElementById("launcher-status");
    if (!status) return;
    status.textContent = text;
    status.className = warn ? "warn" : "";
  }

  function formatOpenResults(results) {
    if (!results.length) return "没有返回结果。";
    // Under the same groups the launcher shows, so a result sits where its lane was picked from.
    const groupOf = new Map();
    launcherGroups(currentSnapshot).forEach((group) => group.lanes.forEach((lane) => groupOf.set(lane.address, group.name)));
    const labels = {
      launch_requested: "已请求打开",
      skipped_online: "已在线，跳过",
      skipped_launching: "正在启动，跳过",
      failed: "失败",
    };
    const groups = new Map();
    results.forEach((entry) => {
      const group = groupOf.get(entry.address) || "其他";
      if (!groups.has(group)) groups.set(group, []);
      groups.get(group).push(
        entry.address + "：" + (labels[entry.status] || entry.status) +
        (entry.message ? "（" + entry.message + "）" : "")
      );
    });
    return [...groups].map(([group, entries]) => group + "\n" + entries.join("\n")).join("\n\n");
  }

  load();
  setInterval(load, POLL_MS);
})();
</script>
</body>
</html>
