<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>问答 · Lane Router</title>
<style>
  :root { color-scheme: light dark; --bg: light-dark(#f7f8fa, #15181e); --panel: light-dark(#fff, #1c2028); --text: light-dark(#202938, #edf0f6); --muted: light-dark(#667083, #aab3c3); --line: light-dark(#e2e6ed, #353c49); --hover: light-dark(#edf1f7, #29313e); --active: light-dark(#e9effc, #25334d); --blue: light-dark(#355ca8, #aac6ff); --warm: light-dark(#875b14, #efc478); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.65 system-ui, "Microsoft YaHei", sans-serif; overflow-wrap: anywhere; }
  button, textarea, select, input { font: inherit; color: inherit; }
  button, select { cursor: pointer; }
  button { border: 1px solid var(--line); border-radius: 7px; padding: 6px 11px; background: var(--panel); }
  button:hover { background: var(--hover); }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  a { color: var(--blue); }
  h1 { font-size: 19px; font-weight: 600; margin: 0; cursor: help; }
  h2 { font-size: 18px; font-weight: 550; margin: 0 0 5px; }
  p { margin: 6px 0; }
  .muted, .meta { color: var(--muted); }
  .meta { font-size: 12px; }
  .warning { color: var(--warm); }
  .sidebar { display: flex; flex-direction: column; gap: 10px; padding: 14px 12px 0; background: var(--panel); }
  .sidebar-head { display: flex; align-items: baseline; gap: 12px; padding: 0 4px; }
  .sidebar-head a { margin-left: auto; font-size: 13px; }
  #new-issue { flex: none; padding: 3px 10px; }
  #filters { display: flex; flex-wrap: wrap; gap: 4px; }
  #filters button { border-color: transparent; background: transparent; padding: 5px 9px; }
  #filters [aria-pressed="true"] { background: var(--text); color: var(--panel); }
  .list-bar { display: flex; align-items: center; gap: 8px; padding: 0 4px; }
  /* One line: only the time is written there, the full date and the polling interval go in its
     title, and the ellipsis is a fallback. A read error is shown whole. */
  #list-status { flex: 1 1 auto; min-width: 0; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list-status.warning { white-space: normal; }
  #refresh { flex: none; padding: 3px 10px; }
  .list-panel { margin: 0 -12px; padding: 8px 12px 12px; border-top: 1px solid var(--line); }
  main { min-width: 0; background: var(--panel); }
  #markdown-status { margin: 0; padding: 12px 16px 0; }
  .topic { display: block; width: 100%; text-align: left; padding: 16px 13px; margin-bottom: 6px; border-color: transparent; background: transparent; border-radius: 9px; }
  .topic[aria-current="true"] { background: var(--active); border-color: var(--line); }
  .topic.kept { opacity: .55; }
  .topic-title, .topic-meta { display: block; }
  .topic-title { font-weight: 550; margin: 5px 0; }
  .topic-meta { color: var(--muted); font-size: 12px; }
  .badge { display: inline-block; margin-right: 9px; font-size: 12px; color: var(--muted); }
  .badge.ask { color: var(--warm); }
  .badge.unread { color: var(--blue); }
  #issue-detail { min-width: 0; background: var(--panel); padding: 16px; }
  .detail-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
  #close-issue { white-space: nowrap; }
  .empty { padding: 24px 12px; color: var(--muted); }
  #questions { margin-top: 12px; font-size: 12px; color: var(--muted); }
  .question { margin: 5px 0; }
  #history { display: grid; gap: 22px; padding: 22px 0; }
  .entry { border-left: 2px solid var(--line); padding-left: 13px; }
  .entry.user { border-color: var(--blue); }
  .entry.event { border-left: 0; padding-left: 0; }
  .event-line { margin: 0; font-size: 12px; color: var(--muted); }
  .entry-body { margin-top: 7px; }
  .entry-body.plain-text { white-space: pre-wrap; }
  .entry-body > :first-child { margin-top: 0; }
  .entry-body > :last-child { margin-bottom: 0; }
  .entry-body :is(h1, h2, h3, h4, h5, h6) { margin: 18px 0 8px; line-height: 1.4; }
  .entry-body h1 { font-size: 22px; }
  .entry-body h2 { font-size: 19px; }
  .entry-body :is(h3, h4, h5, h6) { font-size: 16px; }
  .entry-body :is(ul, ol) { padding-left: 25px; margin: 9px 0; }
  .entry-body blockquote { margin: 12px 0; padding: 1px 13px; border-left: 3px solid var(--line); color: var(--muted); }
  .entry-body code { font: .9em/1.6 ui-monospace, Consolas, monospace; background: var(--bg); padding: 2px 5px; border-radius: 4px; overflow-wrap: anywhere; }
  /* Long lines wrap instead of scrolling sideways: a one-line shell command that runs off the
     right edge cannot be read, and the copy button hands over the exact text anyway. */
  .entry-body pre { position: relative; max-width: 100%; overflow-x: auto; padding: 13px 64px 13px 13px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); white-space: pre-wrap; overflow-wrap: anywhere; }
  .entry-body pre code { padding: 0; background: transparent; }
  /* A local path the Router opens on a click: it still reads as the path, framed as a control. */
  .entry-body .local-path { display: inline; min-height: 0; margin: 0; padding: 0 3px; border: 1px solid var(--line); border-radius: 5px; background: transparent; color: var(--blue); font: inherit; line-height: inherit; text-align: left; overflow-wrap: anywhere; }
  .entry-body .local-path:hover { background: var(--hover); }
  .entry-body .local-path code { color: inherit; }
  .entry-body pre .copy-code { position: absolute; top: 6px; right: 6px; font-size: 12px; padding: 2px 8px; }
  .entry-body table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin: 12px 0; }
  .entry-body :is(th, td) { border: 1px solid var(--line); padding: 7px 12px; text-align: left; }
  .entry-body th { background: var(--bg); }
  .entry-body hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
  .entry-head { font-size: 12px; color: var(--muted); }
  .delivery { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .new-divider { display: flex; align-items: center; gap: 10px; color: var(--blue); font-size: 12px; }
  .new-divider::before, .new-divider::after { content: ""; flex: 1; border-top: 1px solid var(--blue); }
  #compose-region { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 6px; }
  /* Folded to two lines until it is in use: the reply area stays on screen under the history, and
     every line it holds is a line the history does not get. */
  /* minmax(0, …): 回复对象 shows the question's text, which must not widen the form past the window. */
  #reply-form { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #reply-body { width: 100%; height: calc(2 * 1.65em + 22px); min-height: calc(2 * 1.65em + 22px); padding: 11px; resize: vertical; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  #compose[data-expanded="true"] #reply-body { height: calc(6 * 1.65em + 22px); }
  .compose-bottom { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; }
  #reply-question { flex: 1 1 180px; min-width: 0; padding: 5px 7px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
  .compose-bottom #send-reply { margin-left: auto; }
  .primary { background: var(--text); color: var(--panel); border-color: var(--text); }
  .primary:hover { background: var(--text); opacity: .9; }
  #close-confirmation { padding: 13px; margin-top: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  #close-confirmation p { margin-bottom: 10px; }
  #operation-status { white-space: pre-wrap; margin-top: 12px; }
  #operation-recovery { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  /* The new-issue view takes the place of the issue. Its fields are width: 100%, and a form control
     sized by a percentage gives the form no minimum width, so a long lane address in 发给 cannot
     widen it past the window. */
  #new-issue-view { min-width: 0; background: var(--panel); padding: 16px; }
  #new-form { display: grid; gap: 6px; margin-top: 16px; }
  #new-form label:not(.visually-hidden) { font-size: 12px; color: var(--muted); margin-top: 6px; }
  #new-lane, #new-title { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
  #new-body { width: 100%; height: calc(10 * 1.65em + 22px); min-height: calc(3 * 1.65em + 22px); margin-top: 8px; padding: 11px; resize: vertical; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .compose-bottom #send-new { margin-left: auto; }
  #new-status { white-space: pre-wrap; margin-top: 12px; }
  #new-recovery { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  [hidden] { display: none !important; }
  /* Wide screens: a sidebar down the left edge holds the title, the filters and the issue list, and
     the open issue fills the rest of the window, which never counts as less than 420px high. The list
     and the history each scroll on their own; the history sits between a fixed title bar and a fixed
     reply area. The page itself stops growing with the content. Narrow screens keep scrolling the
     whole page: a scroll box inside a phone screen is harder to use than none. */
  @media (min-width: 681px) {
    body { display: flex; height: 100vh; min-height: 420px; }
    .sidebar { flex: none; width: clamp(240px, 24vw, 320px); border-right: 1px solid var(--line); }
    .sidebar > * { flex: none; }
    .sidebar > .list-panel { flex: 1 1 0; min-height: 0; overflow-y: auto; }
    main { flex: 1 1 0; display: flex; flex-direction: column; }
    main > * { flex: none; }
    #markdown-status { padding: 12px 32px 0; }
    #issue-detail { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; padding: 16px 32px; }
    #detail-content { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
    #detail-header, #compose-region { flex: none; }
    #history-region { flex: 1 1 0; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
    #compose-region { max-height: 50%; overflow-y: auto; }
    #new-issue-view { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 16px 32px; }
  }
  @media (max-width: 680px) {
    .sidebar { padding: 14px 14px 0; border-bottom: 1px solid var(--line); }
    .list-panel { margin: 0 -14px; padding: 8px 14px 12px; }
    .detail-head { flex-wrap: wrap; }
    #reply-body, #new-body, #new-title { font-size: 16px; }
  }
  @media (pointer: coarse) { button, select { min-height: 44px; } }
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-head"><h1 title="集中查看答复与问题。看不懂可以继续追问，一轮回复不会自动结束议题。&#10;可以在这里新开问答，也可以接着已有的问答讨论">问答</h1><button type="button" id="new-issue" class="primary">新问答</button><a href="/dashboard">运行看板</a></div>
  <nav id="filters" aria-label="议题筛选">
    <button type="button" data-filter="attention" aria-pressed="true">待我处理</button>
    <button type="button" data-filter="open" aria-pressed="false">进行中</button>
    <button type="button" data-filter="all" aria-pressed="false">全部</button>
    <button type="button" data-filter="closed" aria-pressed="false">已结束</button>
  </nav>
  <div class="list-bar"><p id="list-status" class="meta" role="status">正在读取议题…</p><button type="button" id="refresh">刷新</button></div>
  <nav class="list-panel" aria-label="议题列表"><div id="thread-list"></div><button type="button" id="load-threads" hidden>加载更多议题</button></nav>
</aside>
<main>
  <p id="markdown-status" class="warning" role="status" hidden>Markdown 组件未能加载，暂时显示原文。可刷新页面重试；回复仍可正常保存。</p>
  <section id="issue-detail" aria-label="议题详情">
    <p id="detail-empty" class="empty">选择一个议题，查看完整讨论。</p>
    <div id="detail-content" hidden>
      <div id="detail-header">
        <div class="detail-head"><div><h2 id="detail-title"></h2><p id="detail-meta" class="meta"></p></div><button type="button" id="close-issue">结束议题</button></div>
        <div id="close-confirmation" hidden role="group" aria-label="确认结束议题" tabindex="-1">
          <p>确定结束这个议题吗？历史将保留，结束后不能继续回复。已保存的输入仍会交给 lane 处理。</p>
          <button type="button" id="confirm-close" class="primary">确认结束</button>
          <button type="button" id="cancel-close">取消</button>
        </div>
        <p id="detail-status" class="meta" role="status"></p>
      </div>
      <div id="history-region" tabindex="0" aria-label="讨论历史">
        <div id="questions" aria-label="问题状态"></div>
        <div id="history"></div>
        <button type="button" id="load-history" hidden>继续加载历史</button>
      </div>
      <div id="compose-region">
        <p id="read-status" class="meta" role="status"></p>
        <div id="compose"></div>
        <p id="operation-status" role="status"></p>
        <div id="operation-recovery" hidden><button type="button" id="retry-operation">用同一操作重试</button><button type="button" id="check-history">查看后端历史</button></div>
      </div>
    </div>
  </section>
  <section id="new-issue-view" aria-label="新问答" hidden>
    <div class="detail-head"><h2>新问答</h2><button type="button" id="cancel-new">取消</button></div>
    <form id="new-form">
      <label for="new-lane">发给</label>
      <select id="new-lane"></select>
      <label for="new-title">标题</label>
      <input type="text" id="new-title" placeholder="默认取正文第一行" autocomplete="off">
      <label for="new-body" class="visually-hidden">正文</label>
      <textarea id="new-body" placeholder="写下要对这个 lane 说的话…"></textarea>
      <div class="compose-bottom"><span class="meta">发出后交给所选 lane，等同于在 TUI 里对它说。</span><button type="submit" id="send-new" class="primary">发送</button></div>
    </form>
    <p id="new-status" role="status"></p>
    <div id="new-recovery" hidden><button type="button" id="retry-new">用同一操作重试</button><button type="button" id="check-new">查看后端历史</button></div>
  </section>
</main>
<script src="/issues/assets/markdown-it.js"></script>
<script>
(() => {
  "use strict";
  const PAGE_SIZE = 100;
  const views = new Map();
  let filter = "attention", selectedId = null, actionToken = null;
  let listItems = [], listCursor = null, listPages = 1, listVersion = 0, listLoading = false;
  const byId = id => document.getElementById(id);
  const node = (tag, className, text) => {
    const element = document.createElement(tag);
    if (className) element.className = className;
    if (text !== undefined) element.textContent = text;
    return element;
  };
  const markdown = typeof document.defaultView.markdownit === "function"
    ? new document.defaultView.markdownit({ html: false, breaks: true, linkify: false }).disable("image") : null;
  if (markdown) {
    markdown.renderer.rules.link_open = (tokens, index, options, env, renderer) => {
      tokens[index].attrSet("target", "_blank");
      tokens[index].attrSet("rel", "noopener noreferrer");
      return renderer.renderToken(tokens, index, options);
    };
  } else byId("markdown-status").hidden = false;
  /**
   * The user's own words are shown as typed: what they write is not Markdown to them. Local paths
   * in it still open. Without the Markdown component every entry is plain text.
   */
  function entryBody(text, plain) {
    const body = node("div", "entry-body");
    // HTML input stays escaped; only the parser's own markup reaches this sink.
    if (markdown && !plain) body.innerHTML = markdown.render(text);
    else { body.classList.add("plain-text"); body.textContent = text; }
    if (markdown) linkLocalPaths(body);
    body.querySelectorAll("pre").forEach(addCopyButton);
    return body;
  }
  // A whole drive-letter absolute path, X:\… or X:/…; network, device and relative paths never match.
  const DRIVE_PATH = /^[A-Za-z]:[\\/][^<>:"|?*\u0000-\u001f]*$/;
  // The same in running text: no spaces, not the tail of a word or a URL, and stopping at a full-width
  // sentence mark. Punctuation it ends with belongs to the sentence, and so does a closing backtick:
  // people wrap paths in them out of habit even where nothing renders them.
  const TEXT_PATH = /(?<![\w\\/:.%~+-])[A-Za-z]:[\\/][^\s<>:"|?*。，、；：！？]*/g;
  const SENTENCE_END = /[.,;!?)\]}'’”）」』》】`]+$/;
  /**
   * Paths in inline code (less any ":line" or ":line:column" after them) and in running text become
   * links the Router opens. Code blocks are left as text, to be copied.
   */
  function linkLocalPaths(body) {
    for (const code of body.querySelectorAll("code")) {
      const path = code.textContent.trim().replace(/:\d+(?::\d+)?$/, "");
      if (code.closest("pre, a") || !DRIVE_PATH.test(path)) continue;
      const link = pathLink(path); code.replaceWith(link); link.append(code);
    }
    const texts = [];
    for (let walker = document.createTreeWalker(body, document.defaultView.NodeFilter.SHOW_TEXT), text; (text = walker.nextNode());) {
      if (!text.parentElement.closest("pre, code, a, .local-path")) texts.push(text);
    }
    for (const text of texts) {
      const parts = []; let end = 0;
      for (const match of text.data.matchAll(TEXT_PATH)) {
        const path = match[0].replace(SENTENCE_END, "");
        if (!DRIVE_PATH.test(path)) continue;
        const link = pathLink(path); link.textContent = path;
        parts.push(text.data.slice(end, match.index), link); end = match.index + path.length;
      }
      if (parts.length) text.replaceWith(...parts, text.data.slice(end));
    }
  }
  function pathLink(path) {
    const link = node("button", "local-path"); link.type = "button"; link.title = "用本机程序打开";
    link.addEventListener("click", () => { void openLocalPath(path); });
    return link;
  }
  const openedNotices = {
    opened: () => ["已打开", false],
    revealed: () => ["这类文件不直接打开，已在资源管理器里选中它", false],
    missing: result => ["文件已不在：" + result.path, true],
    refused: result => ["不能打开这个路径（" + result.reason + "）", true],
  };
  /**
   * What happened goes where the issue's operations report; one of those still sending or of
   * unknown outcome keeps that line until it resolves, since its text says how to recover.
   */
  async function openLocalPath(path) {
    const id = selectedId;
    let notice;
    try {
      const { result } = await request("/local-files/open", {
        method: "POST", headers: { "content-type": "application/json", "x-lane-router-action": "open-local-path" },
        body: JSON.stringify({ actionToken, path }),
      });
      notice = (openedNotices[result && result.action] || (() => ["未能确认是否已打开", true]))(result);
    } catch (error) { notice = ["打开失败：" + error.message, true]; }
    const view = id ? viewFor(id) : null;
    if (!view || view.operation) return;
    [view.notice, view.warning] = notice; renderDetail(id);
  }
  // The window's navigator rather than the bare global, so the page and its tests look at the same
  // clipboard. The label stays on "已复制" until the issue is next opened, when its entries are
  // rebuilt (polls keep them as they are): no timer, because the page's timers are reserved for
  // request timeouts.
  function addCopyButton(pre) {
    const button = node("button", "copy-code", "复制");
    button.type = "button";
    button.addEventListener("click", async () => {
      const source = pre.querySelector("code") || pre;
      const text = source.textContent.replace(/\n$/, "");
      const clipboard = document.defaultView.navigator && document.defaultView.navigator.clipboard;
      try {
        if (!clipboard || typeof clipboard.writeText !== "function") throw new Error("no clipboard");
        await clipboard.writeText(text);
        button.textContent = "已复制";
      } catch { button.textContent = "复制失败，请手动选中"; }
    });
    pre.append(button);
  }
  const ownerText = owner => (owner.address || owner.laneId) + (owner.state === "archived" ? " · 已归档" : owner.state === "missing" ? " · 已缺失" : "");
  const presenceLabels = { online: "在线", busy: "可能在忙", unconfirmed: "未确认", offline: "离线" };
  // The lane, then whether the Router believes it can reach it: a belief, and the page says so. A
  // Router from before presence existed sends none, and none is shown.
  function ownerNodes(owner) {
    const label = presenceLabels[owner.presence];
    if (!label) return [ownerText(owner)];
    const presence = node("span", "presence", label);
    presence.title = "Router 的判断，不代表 lane 正在处理你的回复";
    return [ownerText(owner) + " · ", presence];
  }
  const time = value => new Date(value).toLocaleString("zh-CN", { hour12: false });
  const clock = value => new Date(value).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" });
  const questionLabels = { waiting_user: "待我回答", waiting_lane: "等待 lane", answered: "已回答", not_needed: "无需回答" };
  // Within 40px of the end counts as at the end: a reader that close is following new content.
  const atBottom = element => element.scrollHeight - element.scrollTop - element.clientHeight <= 40;
  const toBottom = element => { element.scrollTop = element.scrollHeight; };
  // What is on screen now, so a poll that brings nothing new changes nothing a reader is looking at.
  let renderedList = "", renderedQuestions = "", historyFor = null, shownTopics = [];
  // Which entries of the issue on screen have their end in view now; see watchSight.
  let sight = null;
  const entryFacts = new WeakMap();
  function viewFor(id) {
    if (!views.has(id)) views.set(id, { detail: null, entries: [], through: 0, hasMore: false, version: 0, loading: false,
      draft: "", questionId: "", targetChosen: false, operation: null, notice: "", warning: false, confirmClose: false, seen: 0, readAck: 0, reads: new Map(), loadError: "", readError: "" });
    return views.get(id);
  }

  async function request(path, init) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 15000);
    try {
      const response = await fetch(path, { cache: "no-store", ...init, signal: controller.signal });
      const data = await response.json();
      if (!response.ok) {
        const error = new Error((data.error || "请求失败") + "（" + response.status + "）");
        error.uncertain = response.status >= 500;
        throw error;
      }
      if (init === undefined) actionToken = data.actionToken;
      return data;

    if (read.sending) return;
    read.sending = true;
    post(id, "read", { operationKey: read.operationKey, throughSeq }).then(({ result }) => {
      view.readAck = Math.max(view.readAck, result.readSeq); view.readError = "";
    }).catch(error => { view.readError = "已读位置未确认，将在下次刷新时重试：" + error.message; }).finally(() => {
      read.sending = false; if (selectedId === id) byId("read-status").textContent = view.readError;
    });
  }
  function startReply(id) {
    const view = viewFor(id);
    // An ended issue takes a reply too; saving it is what reopens the issue.
    if (view.operation || selectedId !== id) return;
    if (!view.draft.trim()) { view.notice = "请先填写回复。"; view.warning = true; renderDetail(id); return; }
    view.operation = { action: "replies", operationKey: crypto.randomUUID(), payload: { body: view.draft, ...(view.questionId ? { questionId: view.questionId } : {}) }, state: "new" };
    void runOperation(id);
  }
  async function runOperation(id) {
    const view = viewFor(id), operation = view.operation;
    if (!operation || operation.state === "sending") return;
    const wasUncertain = operation.state === "uncertain";
    operation.state = "sending"; view.notice = "正在保存，请稍候…"; view.warning = false; renderDetail(id);
    try {
      const { result, wake } = await post(id, operation.action, { ...operation.payload, operationKey: operation.operationKey });
      if (!result || result.issueId !== id || typeof result.entryId !== "string") throw new Error("未取得可核对的保存结果");
      if (operation.action === "replies") { view.draft = ""; view.questionId = ""; view.targetChosen = false; storeDraft(id, ""); }
      view.operation = null; view.confirmClose = false;
      view.notice = operation.action === "replies" ? wakeNotice(wake) : "议题已结束，历史仍可查看。";
      view.warning = operation.action === "replies" && wake?.status === "failed";
      // The shared composer can now belong to another issue; only reset this issue's controls.
      if (selectedId === id) { byId("compose").removeAttribute("data-for"); renderDetail(id); }
      // The reply just sent is the newest entry; the reader is taken to it once it is back, and
      // the next reply's target is worked out again from what the lane is now waiting on.
      if (operation.action === "replies") { view.followOwnReply = true; view.pickTarget = true; }
      await loadDetail(id, false, true); void loadList();
    } catch (error) {
      if (wasUncertain || error.uncertain !== false) {
        operation.state = "uncertain"; view.notice = "结果未确定：" + error.message + "。正文和操作已保留，请用同一操作重试，或查看后端历史。确认前不能修改或重新发送。";
      } else { view.operation = null; view.notice = "保存失败：" + error.message + "。草稿已保留，可修改后重试。"; }
      view.warning = true; renderDetail(id);
    }
  }

  /** What became of a message just saved and its lane, from the wake the save answered with. */
  const wakeReasons = { no_binding: "没有对话记录", session_not_found: "找不到原来的对话", invalid_startup_cwd: "原来的工作目录不在了",
    backend_unavailable: "这种 lane 不能由 Router 打开，或者 Codex 宿主没连上", terminal_launch_failed: "终端没能启动" };
  function wakeNotice(wake) {
    if (wake?.status === "launch_requested") return "已发送。这个 lane 没开着，已经让 Router 打开它的窗口。";
    if (wake?.status === "skipped_launching") return "已发送。这个 lane 正在打开。";
    if (wake?.status === "failed") return "已发送，但没能打开这个 lane（" + (wakeReasons[wake.reason] || wake.reason) + "）。消息会等它打开后再处理，可以去运行看板手动恢复。";
    return "已发送。";
  }

  /**
   * The new-issue view takes the issue's place; while it is open no issue is selected. Its one
   * draft is kept in this browser apart from the issue drafts, read the first time the view opens,
   * and the lane last chosen is chosen again while it is still listed. 取消 only closes the view.
   */
  const NEW_DRAFT = "lane-router.issues.new-draft", NEW_LANE = "lane-router.issues.new-lane";
  const restoreLabels = { online: "在线", offline: "没开着，发出后会打开它的窗口", unavailable: "Router 打不开它，消息会等它开着时再处理" };
  const fresh = { loaded: false, title: "", body: "", laneId: "", operation: null, notice: "", warning: false };
  let composing = false, lanes = null, lanesError = "", renderedLanes = "";
  function openNew() {
    if (composing) { byId("new-body").focus(); return; }
    if (selectedId && byId("issue-detail").dataset.issueId === selectedId) viewFor(selectedId).scrollTop = byId("history-region").scrollTop;
    selectedId = null; historyFor = null; sight?.observer.disconnect(); sight = null;
    byId("issue-detail").removeAttribute("data-issue-id");
    renderList();
    if (!fresh.loaded) {
      fresh.loaded = true;
      try { const draft = JSON.parse(stored(NEW_DRAFT) || "{}"); fresh.title = String(draft.title ?? ""); fresh.body = String(draft.body ?? ""); } catch { /* no draft */ }
      fresh.laneId = stored(NEW_LANE);
    }
    byId("new-title").value = fresh.title; byId("new-body").value = fresh.body;
    composing = true; renderNew(); void loadLanes();
  }
  function closeNew() {
    composing = false; renderNew();
    byId("detail-empty").textContent = "选择一个议题，查看完整讨论。";
    byId("detail-empty").hidden = false; byId("detail-content").hidden = true;
  }
  async function loadLanes() {
    try { lanes = (await request("/issues/api/lanes")).result.items; lanesError = ""; }
    catch (error) { lanesError = "读取 lane 列表失败：" + error.message; }
    renderNew();
  }
  function renderNew() {
    byId("new-issue-view").hidden = !composing; byId("issue-detail").hidden = composing;
    if (!composing) return;
    const select = byId("new-lane"), signature = JSON.stringify(lanes);
    if (signature !== renderedLanes) {
      renderedLanes = signature;
      const none = node("option", null, lanes ? "选择 lane…" : "正在读取 lane…"); none.value = "";
      const groups = new Map();
      for (const lane of lanes ?? []) {
        if (!groups.has(lane.project)) { const group = node("optgroup"); group.label = lane.project; groups.set(lane.project, group); }
        const option = node("option", null, lane.address + " · " + (restoreLabels[lane.restorePresence] || lane.restorePresence));
        option.value = lane.laneId; groups.get(lane.project).append(option);
      }
      select.replaceChildren(none, ...groups.values());
    }
    const listed = (lanes ?? []).some(lane => lane.laneId === fresh.laneId);
    select.value = listed ? fresh.laneId : "";
    const busy = Boolean(fresh.operation);
    for (const id of ["new-lane", "new-title", "new-body"]) byId(id).disabled = busy;
    byId("send-new").disabled = busy || !listed || !fresh.body.trim();
    byId("new-status").textContent = fresh.notice || lanesError;
    byId("new-status").className = fresh.warning || (!fresh.notice && lanesError) ? "warning" : "meta";
    byId("new-recovery").hidden = !fresh.operation || fresh.operation.state !== "uncertain";
    byId("retry-new").disabled = Boolean(fresh.operation && fresh.operation.state === "sending");
  }
  const storeNewDraft = () => store(NEW_DRAFT, fresh.title || fresh.body ? JSON.stringify({ title: fresh.title, body: fresh.body }) : "");
  /** The body's first line with text in it, less a Markdown heading's marks, cut to 60 characters. */
  function defaultTitle(body) {
    const line = body.split("\n").map(text => text.trim()).find(Boolean) ?? "";
    return [...(line.replace(/^#{1,6}\s+/, "").trim() || line)].slice(0, 60).join("");
  }
  function startNew() {
    if (fresh.operation || !composing) return;
    const lane = (lanes ?? []).find(item => item.laneId === fresh.laneId);
    if (!lane || !fresh.body.trim()) return;
    fresh.operation = { operationKey: crypto.randomUUID(), payload: { laneId: lane.laneId, title: fresh.title.trim() || defaultTitle(fresh.body), body: fresh.body }, state: "new" };
    void runNew();
  }
  /** As runOperation, for an issue that does not exist yet: one key per draft, kept until settled. */
  async function runNew() {
    const operation = fresh.operation;
    if (!operation || operation.state === "sending") return;
    const wasUncertain = operation.state === "uncertain";
    operation.state = "sending"; fresh.notice = "正在保存，请稍候…"; fresh.warning = false; renderNew();
    try {
      const { result, wake } = await request("/issues/api/threads", {
        method: "POST", headers: { "content-type": "application/json", "x-lane-router-action": "issues-create" },
        body: JSON.stringify({ ...operation.payload, operationKey: operation.operationKey, actionToken }),
      });
      if (!result || typeof result.issueId !== "string" || typeof result.entryId !== "string") throw new Error("未取得可核对的保存结果");
      Object.assign(fresh, { operation: null, title: "", body: "", notice: "", warning: false, laneId: operation.payload.laneId });
      byId("new-title").value = ""; byId("new-body").value = "";
      store(NEW_DRAFT, ""); store(NEW_LANE, fresh.laneId);
      const view = viewFor(result.issueId);
      view.notice = wakeNotice(wake); view.warning = wake?.status === "failed";
      // It waits on the lane, so it is under 进行中, not 待我处理. A reader who has gone elsewhere
      // in the meantime stays there.
      if (composing) { composing = false; renderNew(); showFilter("open"); selectIssue(result.issueId); }
      else void loadList();
    } catch (error) {
      if (wasUncertain || error.uncertain !== false) {
        operation.state = "uncertain"; fresh.notice = "结果未确定：" + error.message + "。正文和操作已保留，请用同一操作重试，或查看后端历史。确认前不能修改或重新发送。";
      } else { fresh.operation = null; fresh.notice = "保存失败：" + error.message + "。草稿已保留，可修改后重试。"; }
      fresh.warning = true; renderNew();
    }
  }

  function showFilter(name) {
    filter = name; listPages = 1; listCursor = null; listItems = []; shownTopics = []; listVersion++; listLoading = false;
    for (const tab of document.querySelectorAll("[data-filter]")) tab.setAttribute("aria-pressed", String(tab.dataset.filter === name));
    renderList(); void loadList();
  }
  for (const button of document.querySelectorAll("[data-filter]")) button.addEventListener("click", () => showFilter(button.dataset.filter));
  byId("new-issue").addEventListener("click", openNew);
  byId("cancel-new").addEventListener("click", closeNew);
  byId("new-lane").addEventListener("change", () => { if (!fresh.operation) { fresh.laneId = byId("new-lane").value; store(NEW_LANE, fresh.laneId); renderNew(); } });
  byId("new-title").addEventListener("input", () => { if (!fresh.operation) { fresh.title = byId("new-title").value; storeNewDraft(); } });
  byId("new-body").addEventListener("input", () => { if (!fresh.operation) { fresh.body = byId("new-body").value; storeNewDraft(); renderNew(); } });
  byId("new-form").addEventListener("submit", event => { event.preventDefault(); startNew(); });
  byId("retry-new").addEventListener("click", () => { void runNew(); });
  byId("check-new").addEventListener("click", () => showFilter("open"));
  const refresh = () => { void loadList(); if (selectedId) void loadDetail(selectedId); if (composing) void loadLanes(); };
  byId("refresh").addEventListener("click", refresh);
  byId("load-threads").addEventListener("click", () => { void loadList(true); });
  byId("load-history").addEventListener("click", () => { if (selectedId) void loadDetail(selectedId, true); });
  byId("close-issue").addEventListener("click", () => { if (selectedId) { const view = viewFor(selectedId); if (!view.operation) { view.confirmClose = true; renderDetail(selectedId); byId("close-confirmation").focus(); } } });
  byId("cancel-close").addEventListener("click", () => { if (selectedId) { viewFor(selectedId).confirmClose = false; renderDetail(selectedId); byId("close-issue").focus(); } });
  byId("confirm-close").addEventListener("click", () => {
    if (!selectedId) return;
    const view = viewFor(selectedId);
    if (view.operation || !view.confirmClose || view.detail.thread.status === "closed") return;
    view.operation = { action: "close", operationKey: crypto.randomUUID(), payload: { body: "用户在议题页面明确确认结束讨论。" }, state: "new" };
    void runOperation(selectedId);
  });
  byId("retry-operation").addEventListener("click", () => { if (selectedId) void runOperation(selectedId); });
  byId("check-history").addEventListener("click", () => { if (selectedId) void loadDetail(selectedId, false, true); });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState !== "hidden") { refresh(); if (sight) noteSeen(sight.id); } });
  // Coming back to the window reads what is in front of the reader without another scroll.
  document.defaultView.addEventListener("focus", () => { if (sight) noteSeen(sight.id); });
  // An operation in flight or of unknown outcome holds a key a reload would lose, so leaving asks
  // first. A draft alone does not: it is kept in storage.
  document.defaultView.addEventListener("beforeunload", event => { if (fresh.operation || [...views.values()].some(view => view.operation)) event.preventDefault(); });
  void loadList();
  setInterval(() => { if (document.visibilityState !== "hidden") refresh(); }, 5000);
})();
</script>
</body>
</html>
