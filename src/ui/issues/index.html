<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>问答 · Lane Router</title>
<style>
  :root { color-scheme: light dark; --bg: light-dark(#f7f8fa, #15181e); --panel: light-dark(#fff, #1c2028); --text: light-dark(#202938, #edf0f6); --muted: light-dark(#667083, #aab3c3); --line: light-dark(#e2e6ed, #353c49); --hover: light-dark(#edf1f7, #29313e); --active: light-dark(#e9effc, #25334d); --blue: light-dark(#355ca8, #aac6ff); --warm: light-dark(#875b14, #efc478); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.65 system-ui, "Microsoft YaHei", sans-serif; overflow-wrap: anywhere; }
  button, textarea, select, input { font: inherit; color: inherit; }
  button, select { cursor: pointer; }
  button { border: 1px solid var(--line); border-radius: 7px; padding: 6px 11px; background: var(--panel); }
  button:hover { background: var(--hover); }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  a { color: var(--blue); }
  h1 { font-size: 19px; font-weight: 600; margin: 0; cursor: help; }
  h2 { font-size: 18px; font-weight: 550; margin: 0 0 5px; }
  p { margin: 6px 0; }
  .muted, .meta { color: var(--muted); }
  .meta { font-size: 12px; }
  .warning { color: var(--warm); }
  .sidebar { display: flex; flex-direction: column; gap: 10px; padding: 14px 12px 0; background: var(--panel); }
  .sidebar-head { display: flex; align-items: baseline; gap: 12px; padding: 0 4px; }
  .sidebar-head a { margin-left: auto; font-size: 13px; }
  #new-issue { flex: none; padding: 3px 10px; }
  /* A row of its own under the title, kept small: it is pressed after an account switch, not often. */
  .continue-bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 4px; }
  .continue-bar button { padding: 2px 9px; font-size: 12px; }
  #continue-status { margin: 0; padding: 0 4px; }
  #filters { display: flex; flex-wrap: wrap; gap: 4px; }
  #filters button { border-color: transparent; background: transparent; padding: 5px 9px; }
  #filters [aria-pressed="true"] { background: var(--text); color: var(--panel); }
  /* As wide as the sidebar, on a phone too: a project's name and its 待我处理 count stay readable. */
  #project-filter { width: 100%; padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
  .list-bar { display: flex; align-items: center; gap: 8px; padding: 0 4px; }
  /* One line: only the time is written there, the full date and the polling interval go in its
     title, and the ellipsis is a fallback. A read error is shown whole. */
  #list-status { flex: 1 1 auto; min-width: 0; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list-status.warning { white-space: normal; }
  #refresh { flex: none; padding: 3px 10px; }
  .list-panel { margin: 0 -12px; padding: 8px 12px 12px; border-top: 1px solid var(--line); }
  main { min-width: 0; background: var(--panel); }
  #markdown-status { margin: 0; padding: 12px 16px 0; }
  /* What the content area shows: the issues, or the progress board. A row of its own under the title,
     which has no room left at the sidebar's narrowest; underlined, so it does not read as a list filter. */
  .view-tabs { display: flex; gap: 4px; padding: 0 4px; }
  .view-tabs [role="tab"] { padding: 2px 8px; border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; color: var(--muted); font-size: 13px; }
  .view-tabs [aria-selected="true"] { border-bottom-color: var(--text); color: var(--text); }
  /* The board keeps a fixed height where the content follows the list; wide screens give it the rest. */
  #progress-view { display: flex; flex-direction: column; gap: 8px; min-width: 0; padding: 8px 16px 16px; background: var(--panel); }
  #progress-note { margin: 0; }
  #progress-open { margin-left: 4px; }
  #progress-view iframe { width: 100%; height: 80vh; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  /* A group's head reads as a label over its issues: the project, how many, and what waits on the user,
     that last kept to the right edge where it lines up from group to group. */
  .project-group + .project-group { margin-top: 8px; }
  .group-head { display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left; padding: 5px 13px; border-color: transparent; background: transparent; font-size: 13px; }
  .group-head::before { content: "▾"; flex: none; width: 1em; color: var(--muted); }
  .group-head[aria-expanded="false"]::before { content: "▸"; }
  .group-name { min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .group-count { flex: none; color: var(--muted); font-size: 12px; }
  .group-head .group-attention { flex: none; margin: 0 0 0 auto; }
  .topic { display: block; width: 100%; text-align: left; padding: 16px 13px; margin-bottom: 6px; border-color: transparent; background: transparent; border-radius: 9px; }
  .topic[aria-current="true"] { background: var(--active); border-color: var(--line); }
  .topic.kept { opacity: .55; }
  .topic-title, .topic-meta { display: block; }
  .topic-title { font-weight: 550; margin: 5px 0; }
  .topic-meta { color: var(--muted); font-size: 12px; }
  .badge { display: inline-block; margin-right: 9px; font-size: 12px; color: var(--muted); }
  .badge.ask { color: var(--warm); }
  .badge.unread { color: var(--blue); }
  #issue-detail { min-width: 0; background: var(--panel); padding: 16px; }
  .detail-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
  #close-issue { white-space: nowrap; }
  .empty { padding: 24px 12px; color: var(--muted); }
  #questions { margin-top: 12px; font-size: 12px; color: var(--muted); }
  .question { margin: 5px 0; }
  #history { display: grid; gap: 22px; padding: 22px 0; }
  .entry { border-left: 2px solid var(--line); padding-left: 13px; }
  .entry.user { border-color: var(--blue); }
  .entry.event { border-left: 0; padding-left: 0; }
  .event-line { margin: 0; font-size: 12px; color: var(--muted); }
  .entry-body { margin-top: 7px; }
  .entry-body.plain-text { white-space: pre-wrap; }
  .entry-body > :first-child { margin-top: 0; }
  .entry-body > :last-child { margin-bottom: 0; }
  .entry-body :is(h1, h2, h3, h4, h5, h6) { margin: 18px 0 8px; line-height: 1.4; }
  .entry-body h1 { font-size: 22px; }
  .entry-body h2 { font-size: 19px; }
  .entry-body :is(h3, h4, h5, h6) { font-size: 16px; }
  .entry-body :is(ul, ol) { padding-left: 25px; margin: 9px 0; }
  .entry-body blockquote { margin: 12px 0; padding: 1px 13px; border-left: 3px solid var(--line); color: var(--muted); }
  .entry-body code { font: .9em/1.6 ui-monospace, Consolas, monospace; background: var(--bg); padding: 2px 5px; border-radius: 4px; overflow-wrap: anywhere; }
  /* Long lines wrap instead of scrolling sideways: a one-line shell command that runs off the
     right edge cannot be read, and the copy button hands over the exact text anyway. */
  .entry-body pre { position: relative; max-width: 100%; overflow-x: auto; padding: 13px 64px 13px 13px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); white-space: pre-wrap; overflow-wrap: anywhere; }
  .entry-body pre code { padding: 0; background: transparent; }
  /* A local path the Router opens on a click: it still reads as the path, framed as a control. */
  .entry-body .local-path { display: inline; min-height: 0; margin: 0; padding: 0 3px; border: 1px solid var(--line); border-radius: 5px; background: transparent; color: var(--blue); font: inherit; line-height: inherit; text-align: left; overflow-wrap: anywhere; }
  .entry-body .local-path:hover { background: var(--hover); }
  .entry-body .local-path code { color: inherit; }
  /* Another issue named in an entry: the reference as written, then that issue's title, quieter. */
  .issue-ref-title { margin-left: 2px; color: var(--muted); font-size: .85em; }
  /* Files under an entry: images as thumbnails that open full size, others by name. */
  .entry-files { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; margin-top: 8px; }
  .entry-files img { display: block; max-height: 160px; max-width: 100%; border: 1px solid var(--line); border-radius: 6px; }
  .entry-files button { font-size: 13px; padding: 3px 9px; }
  /* Files waiting to go with a reply or a new issue; nothing shows until there is one. */
  .tray { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .tray:empty { display: none; }
  .tray-item { display: flex; align-items: center; gap: 6px; max-width: 100%; padding: 3px 4px 3px 6px; border: 1px solid var(--line); border-radius: 7px; font-size: 12px; }
  .tray-item img { max-height: 40px; max-width: 72px; border-radius: 4px; }
  .tray-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
  .tray-item button { font-size: 12px; padding: 1px 7px; }
  form.dropping { outline: 2px dashed var(--blue); outline-offset: 4px; border-radius: 8px; }
  .send-key { padding: 4px 6px; font-size: 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
  .entry-body pre .copy-code { position: absolute; top: 6px; right: 6px; font-size: 12px; padding: 2px 8px; }
  .entry-body table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin: 12px 0; }
  .entry-body :is(th, td) { border: 1px solid var(--line); padding: 7px 12px; text-align: left; }
  .entry-body th { background: var(--bg); }
  .entry-body hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
  .entry-head { font-size: 12px; color: var(--muted); }
  .delivery { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .new-divider { display: flex; align-items: center; gap: 10px; color: var(--blue); font-size: 12px; }
  .new-divider::before, .new-divider::after { content: ""; flex: 1; border-top: 1px solid var(--blue); }
  #compose-region { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 6px; }
  /* Folded to two lines until it is in use: the reply area stays on screen under the history, and
     every line it holds is a line the history does not get. */
  /* minmax(0, …): 回复对象 shows the question's text, which must not widen the form past the window. */
  #reply-form { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #reply-body { width: 100%; height: calc(2 * 1.65em + 22px); min-height: calc(2 * 1.65em + 22px); padding: 11px; resize: vertical; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  #compose[data-expanded="true"] #reply-body { height: calc(6 * 1.65em + 22px); }
  .compose-bottom { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; }
  #reply-question { flex: 1 1 180px; min-width: 0; padding: 5px 7px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
  .compose-bottom #send-reply { margin-left: auto; }
  .primary { background: var(--text); color: var(--panel); border-color: var(--text); }
  .primary:hover { background: var(--text); opacity: .9; }
  #close-confirmation { padding: 13px; margin-top: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  #close-confirmation p { margin-bottom: 10px; }
  #operation-status { white-space: pre-wrap; margin-top: 12px; }
  #operation-recovery { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  /* The new-issue view takes the place of the issue. Its fields are width: 100%, and a form control
     sized by a percentage gives the form no minimum width, so a long lane address in 发给 cannot
     widen it past the window. */
  #new-issue-view { min-width: 0; background: var(--panel); padding: 16px; }
  #new-form { display: grid; gap: 6px; margin-top: 16px; }
  #new-form label:not(.visually-hidden) { font-size: 12px; color: var(--muted); margin-top: 6px; }
  #new-lane, #new-title { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
  #new-body { width: 100%; height: calc(10 * 1.65em + 22px); min-height: calc(3 * 1.65em + 22px); margin-top: 8px; padding: 11px; resize: vertical; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .compose-bottom #send-new { margin-left: auto; }
  #new-status { white-space: pre-wrap; margin-top: 12px; }
  #new-recovery { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  [hidden] { display: none !important; }
  /* Wide screens: a sidebar down the left edge holds the title, the filters and the issue list, and
     the open issue fills the rest of the window, which never counts as less than 420px high. The list
     and the history each scroll on their own; the history sits between a fixed title bar and a fixed
     reply area. The page itself stops growing with the content. Narrow screens keep scrolling the
     whole page: a scroll box inside a phone screen is harder to use than none. */
  @media (min-width: 681px) {
    body { display: flex; height: 100vh; min-height: 420px; }
    .sidebar { flex: none; width: clamp(240px, 24vw, 320px); border-right: 1px solid var(--line); }
    .sidebar > * { flex: none; }
    .sidebar > .list-panel { flex: 1 1 0; min-height: 0; overflow-y: auto; }
    main { flex: 1 1 0; display: flex; flex-direction: column; }
    main > * { flex: none; }
    #markdown-status { padding: 12px 32px 0; }
    #issue-detail { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; padding: 16px 32px; }
    #detail-content { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
    #detail-header, #compose-region { flex: none; }
    #history-region { flex: 1 1 0; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
    #compose-region { max-height: 50%; overflow-y: auto; }
    #new-issue-view { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 16px 32px; }
    #progress-view { flex: 1 1 0; min-height: 0; padding: 8px 32px 16px; }
    #progress-view iframe { flex: 1 1 0; height: auto; min-height: 0; }
  }
  @media (max-width: 680px) {
    .sidebar { padding: 14px 14px 0; border-bottom: 1px solid var(--line); }
    .list-panel { margin: 0 -14px; padding: 8px 14px 12px; }
    .detail-head { flex-wrap: wrap; }
    #reply-body, #new-body, #new-title { font-size: 16px; }
  }
  @media (pointer: coarse) { button, select { min-height: 44px; } }
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-head"><h1 title="集中查看答复与问题。看不懂可以继续追问，一轮回复不会自动结束议题。&#10;可以在这里新开问答，也可以接着已有的问答讨论">问答</h1><button type="button" id="new-issue" class="primary">新问答</button><a href="/dashboard">运行看板</a></div>
  <nav class="view-tabs" role="tablist" aria-label="右侧显示">
    <button type="button" role="tab" id="tab-issues" aria-selected="true">问答</button>
    <button type="button" role="tab" id="tab-progress" aria-selected="false" aria-controls="progress-view">进度</button>
  </nav>
  <div class="continue-bar" role="group" aria-label="切号后继续" title="手动切换账号以后点：给这个后端在用的每条 lane 发一封信。因额度停下的从中断处继续，没停下的确认已读即可">
    <button type="button" id="continue-claude" data-continue="claude">继续 Claude lane</button>
    <button type="button" id="continue-codex" data-continue="codex">继续 Codex lane</button>
  </div>
  <p id="continue-status" class="meta" role="status" hidden></p>
  <nav id="filters" aria-label="议题筛选">
    <button type="button" data-filter="attention" aria-pressed="true">待我处理</button>
    <button type="button" data-filter="open" aria-pressed="false">进行中</button>
    <button type="button" data-filter="all" aria-pressed="false">全部</button>
    <button type="button" data-filter="closed" aria-pressed="false">已结束</button>
  </nav>
  <label for="project-filter" class="visually-hidden">项目筛选</label>
  <select id="project-filter"><option value="">全部项目</option></select>
  <div class="list-bar"><p id="list-status" class="meta" role="status">正在读取议题…</p><button type="button" id="refresh">刷新</button></div>
  <nav class="list-panel" aria-label="议题列表"><div id="thread-list"></div><button type="button" id="load-threads" hidden>加载更多议题</button></nav>
</aside>
<main>
  <p id="markdown-status" class="warning" role="status" hidden>Markdown 组件未能加载，暂时显示原文。可刷新页面重试；回复仍可正常保存。</p>
  <section id="issue-detail" aria-label="议题详情">
    <p id="detail-empty" class="empty">选择一个议题，查看完整讨论。</p>
    <div id="detail-content" hidden>
      <div id="detail-header">
        <div class="detail-head"><div><h2 id="detail-title"></h2><p id="detail-meta" class="meta"></p></div><button type="button" id="close-issue">结束议题</button></div>
        <div id="close-confirmation" hidden role="group" aria-label="确认结束议题" tabindex="-1">
          <p>确定结束这个议题吗？历史将保留，结束后不能继续回复。已保存的输入仍会交给 lane 处理。</p>
          <button type="button" id="confirm-close" class="primary">确认结束</button>
          <button type="button" id="cancel-close">取消</button>
        </div>
        <p id="detail-status" class="meta" role="status"></p>
      </div>
      <div id="history-region" tabindex="0" aria-label="讨论历史">
        <div id="questions" aria-label="问题状态"></div>
        <div id="history"></div>
        <button type="button" id="load-history" hidden>继续加载历史</button>
      </div>
      <div id="compose-region">
        <p id="read-status" class="meta" role="status"></p>
        <div id="compose"></div>
        <p id="operation-status" role="status"></p>
        <div id="operation-recovery" hidden><button type="button" id="retry-operation">用同一操作重试</button><button type="button" id="check-history">查看后端历史</button></div>
      </div>
    </div>
  </section>
  <section id="new-issue-view" aria-label="新问答" hidden>
    <div class="detail-head"><h2>新问答</h2><button type="button" id="cancel-new">取消</button></div>
    <form id="new-form">
      <label for="new-lane">发给</label>
      <select id="new-lane"></select>
      <label for="new-title">标题</label>
      <input type="text" id="new-title" placeholder="默认取正文第一行" autocomplete="off">
      <label for="new-body" class="visually-hidden">正文</label>
      <textarea id="new-body" placeholder="写下要对这个 lane 说的话…"></textarea>
      <div class="compose-bottom"><span class="meta">发出后交给所选 lane，等同于在 TUI 里对它说。</span><button type="submit" id="send-new" class="primary">发送</button></div>
    </form>
    <p id="new-status" role="status"></p>
    <div id="new-recovery" hidden><button type="button" id="retry-new">用同一操作重试</button><button type="button" id="check-new">查看后端历史</button></div>
  </section>
  <section id="progress-view" aria-label="进度" hidden>
    <p id="progress-note" class="meta"><span id="progress-text"></span><a id="progress-open" target="_blank" rel="noopener noreferrer" hidden>在新窗口打开 ↗</a></p>
  </section>
</main>
<script src="/issues/assets/markdown-it.js"></script>
<script>
(() => {
  "use strict";
  const PAGE_SIZE = 100;
  const views = new Map();
  let filter = "attention", selectedId = null, actionToken = null;
  let listItems = [], listCursor = null, listPages = 1, listVersion = 0, listLoading = false;
  /**
   * The list in groups by project. The counts in a group's head come with each read of the list, for
   * its filter; null when they could not be read. The projects to choose from are those last read.
   * The project chosen and the groups folded are kept in this browser; a project no longer listed
   * is all projects, and what cannot be read folds nothing.
   */
  const PROJECT_KEY = "lane-router.issues.project", COLLAPSED_KEY = "lane-router.issues.collapsed-projects";
  let projectCounts = null, projectNames = [], wantedProject = stored(PROJECT_KEY);
  const collapsed = (() => {
    try { const names = JSON.parse(stored(COLLAPSED_KEY) || "[]"); return new Set(Array.isArray(names) ? names : []); } catch { return new Set(); }
  })();
  const chosenProject = () => projectNames.includes(wantedProject) ? wantedProject : "";
  /** "issues" or "progress": what the content area shows. */
  let shownView = "issues";
  const byId = id => document.getElementById(id);
  const node = (tag, className, text) => {
    const element = document.createElement(tag);
    if (className) element.className = className;
    if (text !== undefined) element.textContent = text;
    return element;
  };
  const markdown = typeof document.defaultView.markdownit === "function"
    ? new document.defaultView.markdownit({ html: false, breaks: true, linkify: false }).disable("image") : null;
  if (markdown) {
    markdown.renderer.rules.link_open = (tokens, index, options, env, renderer) => {
      tokens[index].attrSet("target", "_blank");
      tokens[index].attrSet("rel", "noopener noreferrer");
      return renderer.renderToken(tokens, index, options);
    };
  } else byId("markdown-status").hidden = false;
  /**
   * The user's own words are shown as typed: what they write is not Markdown to them. Local paths
   * in it still open. Without the Markdown component every entry is plain text.
   */
  function entryBody(text, plain) {
    const body = node("div", "entry-body");
    // HTML input stays escaped; only the parser's own markup reaches this sink.
    if (markdown && !plain) body.innerHTML = markdown.render(text);
    else { body.classList.add("plain-text"); body.textContent = text; }
    if (markdown) linkLocalPaths(body);
    markIssueRefs(body);
    body.querySelectorAll("pre").forEach(addCopyButton);
    return body;
  }
  // An issue's whole ID, or eight hex digits standing alone as a word; only the Router says whether
  // one names an issue (spec 2026-10-21-issue-page-usability.md, section one).
  const ISSUE_REF = /(?<![0-9a-zA-Z-])(?:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|[0-9a-f]{8})(?![0-9a-zA-Z-])/gi;

  });
  byId("retry-operation").addEventListener("click", () => { if (selectedId) void runOperation(selectedId); });
  byId("check-history").addEventListener("click", () => { if (selectedId) void loadDetail(selectedId, false, true); });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState !== "hidden") { refresh(); if (sight) noteSeen(sight.id); } });
  // Coming back to the window reads what is in front of the reader without another scroll.
  document.defaultView.addEventListener("focus", () => { if (sight) noteSeen(sight.id); });
  // An operation in flight or of unknown outcome holds a key a reload would lose, so leaving asks
  // first. A draft alone does not: it is kept in storage.
  document.defaultView.addEventListener("beforeunload", event => { if (fresh.operation || [...views.values()].some(view => view.operation)) event.preventDefault(); });
  document.defaultView.addEventListener("popstate", () => { void openFromAddress(false); });
  void loadList();
  void openFromAddress(true);
  setInterval(() => { if (document.visibilityState !== "hidden") refresh(); }, 5000);
})();
</script>
</body>
</html>
